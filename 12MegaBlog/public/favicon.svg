<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="novelleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect width="64" height="64" rx="16" fill="url(#novelleGrad)" />

  <!-- Novelle 'N' Crest Monogram -->
  <g filter="url(#glow)">
    <!-- Left Stem (Book Spine) -->
    <path 
      d="M16 18C16 15.7909 17.7909 14 20 14H21C22.6569 14 24 15.3431 24 17V47C24 48.6569 22.6569 50 21 50H20C17.7909 50 16 48.2091 16 46V18Z" 
      fill="white" 
    />
    
    <!-- Diagonal Bridge -->
    <path 
      d="M23 17L41 47" 
      stroke="white" 
      stroke-width="5.5" 
      stroke-linecap="round" 
    />

    <!-- Right Stem (Page Leaf) -->
    <path 
      d="M40 17C40 15.3431 41.3431 14 43 14H44C46.2091 14 48 15.7909 48 18V46C48 48.2091 46.2091 50 44 50H43C41.3431 50 40 48.6569 40 47V17Z" 
      fill="white" 
    />

    <!-- Accent Period Dot -->
    <circle cx="51.5" cy="48" r="2.5" fill="#fbcfe8" />
  </g>
</svg>